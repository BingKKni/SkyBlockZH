// Minecraft 26.2.
//
// The generation where the HUD moved into a `Hud` of its own, the entity type constants moved to
// `EntityTypes`, and screens moved from `Minecraft` onto `Gui`. Four places in the mod care; they live
// in src/mc26_2/.

plugins {
	// Version comes from settings.gradle's pluginManagement, so both targets are on the same Loom.
	id 'net.fabricmc.fabric-loom'
}

ext {
	mcVersion = rootProject.mc26_2_version
	mcRange = rootProject.mc26_2_range
	modMenuVersion = rootProject.modmenu_26_2_version
	versionSourceDir = 'mc26_2'
	artifactTag = '26.2'

	// The newest Minecraft, so this is the target that carries the corpus working tools — `auditLog`,
	// `replayCapture`, `probe` — which report on the corpus rather than on a version and should run
	// once rather than once per target. See gradle/target.gradle.
	primary = true
}

apply from: rootProject.file('gradle/target.gradle')
