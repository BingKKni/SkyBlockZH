org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties — see https://fabricmc.net/develop
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# SemVer pre-release, which is what Fabric's version parser understands as "before 0.1.0": a build
# marked -beta.N sorts below the eventual 0.1.0 release, so a tester who later installs the release
# gets an upgrade rather than a version conflict. Bump the N for each further beta.
version=0.6
group=io.github.bingkkni
archives_base_name=SkyBlockZH

# Per-target Minecraft versions.
#
# `mc26_1_version` is the *oldest* release of that generation, deliberately: compiling against 26.1
# and running on 26.1.2 is safe (every class the mod touches is identical, and Loom would happily let
# a newer member slip in if it were the other way round). Override on the command line to prove the
# range still holds against a later patch, e.g.
#
#     ./gradlew :fabric-26.1:build -Pmc26_1_version=26.1.2
mc26_1_version=26.1
mc26_2_version=26.2
mc26_3_version=26.3

# The Minecraft range each jar declares in fabric.mod.json. Closed at the top on purpose: a version
# that has not been looked at is a version where a silently-unapplied `require = 0` hook would show up
# as "the mod loaded and translates nothing".
mc26_1_range=>=26.1 <26.2
mc26_2_range=>=26.2 <26.3
mc26_3_range=>=26.3 <26.4

# Optional integrations (compile-time only, not required at runtime).
#
# Mod Menu is per-target: 18.0.0 for 26.1, 20.0.1 for 26.2 and 21.0.0 for 26.3.
# It remains optional and is never bundled in the distributed jars.
modmenu_26_1_version=18.0.0
modmenu_26_2_version=20.0.1
modmenu_26_3_version=21.0.0

# Hypixel's Mod API needs no per-target version: this compile-only library is pure protocol code
# with no reference to net.minecraft. Players choose a compatible hypixel-mod-api Fabric mod separately.
hypixel_mod_api_version=1.0.2
