// For the lifecycle task names — `check`, `build`, `clean` — with nothing to compile behind them.
plugins {
	id 'base'
}

// The root project compiles nothing and carries no Minecraft.
//
// Everything here is about the corpus in original_text/, which is the same bytes whichever Minecraft
// the mod is being built for. The two things that do differ per version — which Minecraft to compile
// against and which three classes to compile — live in fabric-26.1/ and fabric-26.2/, both of which
// share this project's src/main and add one small source tree of their own. See gradle/target.gradle
// for what a target does, and settings.gradle for why there are two of them and not four.

version = project.version
group = project.group

// The translation corpus is authored in original_text/ as one file per menu, with a `context` and a
// `gloss` on almost every record explaining what the line is and why it is worded the way it is.
// Those notes are the reason a wrong translation can be argued about instead of just re-guessed, so
// they are not going anywhere — but they are addressed to people, and the mod never reads them.
//
// So the corpus is authored verbatim and *shipped minified*: this task copies it through a filter
// that drops the keys TranslationLoader/TermTable/SkyBlockName never look at and prints what remains
// without indentation. One source of truth is preserved (there is no second corpus to edit, and the
// `id` in a log message still names a record in the file a translator opened), while a player
// downloads roughly a third of the bytes. See MinifyCorpus below for the field-by-field reasoning,
// and `./gradlew corpusSize` for what it saves.
// Built once here and packaged by both targets, rather than minified twice: the trimming depends on
// what the engine reads, and the engine is the shared source tree.
def minifiedCorpus = layout.buildDirectory.dir('minified-corpus')

tasks.register('minifyCorpus', MinifyCorpus) {
	group = 'build'
	description = 'Strips translator-only fields from the corpus for packaging.'

	source = rootProject.file('original_text')
	destination = minifiedCorpus
}

/**
 * Rewrites the corpus with only the fields the mod reads.
 *
 * Which fields those are is not a guess: TranslationLoader#compile reads `id`, `ref`, `translate`,
 * `text`, `zh`, `segments[].text/.zh/.omit/.order`, `placeholders[].token/.type/.example`,
 * `continuation` and `layout`; TermTable#from reads `applies_to_types` and `terms[].en/.zh/.types`;
 * SkyBlockName#from reads `full`, `short` and `compound_stoplist`. Everything else in a corpus file is
 * written for whoever edits it next — `context` and `gloss` (the two biggest, on nearly every record),
 * `raw` (the line with its colour codes, kept so a record can be compared against what the server
 * sent), `placeholders[].desc`, `segments[].color` (a note about where the colour boundary is; the
 * real colour is read off the screen at render time), and the per-file `source`/`fetched_at`/`note`
 * prose.
 *
 * Records are dropped as well as trimmed, but only ones the loader itself throws away: `translate:
 * false` (a proper noun deliberately left in English) and records with no Chinese anywhere that are
 * not `continuation` markers. TranslationEntry#compile returns null for both, so they occupy bytes
 * in the jar and heap during startup to be discarded. A record another file points `ref` at is kept
 * regardless of how it looks on its own, since the pointer has to land somewhere.
 *
 * Verified by `./gradlew checkMinifiedCorpus`, which compiles both the authored and the minified
 * corpus and fails unless the two indexes contain the same records.
 */
abstract class MinifyCorpus extends DefaultTask {
	@InputDirectory
	abstract DirectoryProperty getSource()

	@OutputDirectory
	abstract DirectoryProperty getDestination()

	/** Per-record keys the runtime reads. Anything else on a record is a note to a translator. */
	private static final Set<String> RECORD_KEYS = [
		'id', 'ref', 'translate', 'text', 'zh', 'segments', 'placeholders', 'continuation', 'layout',
	] as Set

	/** `color` is deliberately absent: it documents the boundary, the drawn colour comes off the screen. */
	private static final Set<String> SEGMENT_KEYS = ['text', 'zh', 'omit', 'order'] as Set

	/**
	 * `desc` explains the value to a person. `token`, `type` and `example` all reach the engine:
	 * `example` bounds the placeholder to the kind of value it holds, so stripping it would ship a jar
	 * that matches lines the source tree refuses — see text/ValueShape.java.
	 */
	private static final Set<String> PLACEHOLDER_KEYS = ['token', 'type', 'example'] as Set

	/** Top-level members of the two dictionary files, which are not lists of records. */
	private static final Set<String> DICTIONARY_KEYS = [
		'full', 'short', 'compound_stoplist',      // _shared/SkyBlock_Name.json
		'applies_to_types', 'terms',               // _shared/Terms.json
	] as Set

	/** Per-term keys in _shared/Terms.json; `note` is the translator's reasoning. */
	private static final Set<String> TERM_KEYS = ['en', 'zh', 'types'] as Set

	@TaskAction
	void minify() {
		def slurper = new groovy.json.JsonSlurper()
		def root = source.get().asFile
		def out = destination.get().asFile

		out.deleteDir()
		out.mkdirs()

		// Two passes: the first learns which records are pointed at from elsewhere, so the second can
		// drop an unused record without breaking a `ref` that resolves through it.
		def documents = [:]

		root.eachFileRecurse { file ->
			if (file.isFile() && file.name.endsWith('.json')) {
				def relative = root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
				documents[relative] = slurper.parse(file, 'UTF-8')
			}
		}

		def referenced = [] as Set

		documents.each { relative, document ->
			MinifyCorpus.eachRecord(document) { record ->
				if (record.ref instanceof String) {
					referenced << record.ref
				}
			}
		}

		int keptRecords = 0
		int droppedRecords = 0
		long before = 0
		long after = 0

		documents.each { relative, document ->
			def trimmed = [:]

			document.each { key, value ->
				// Checked before the list branch below: `terms` is a list, but of dictionary entries
				// with no `id`, so the record walk would skip every one of them and write the file out
				// empty — which silently turns off every value translation in the mod.
				if (DICTIONARY_KEYS.contains(key)) {
					trimmed[key] = key == 'terms' ? MinifyCorpus.trimTerms(value) : value
				} else if (value instanceof List) {
					def records = []

					value.each { element ->
						if (!(element instanceof Map) || !element.containsKey('id')) {
							// A list of plain strings (a `todo`, an `aka`) is prose; drop it. The loader
							// only ever looks at list elements that carry an id.
							return
						}

						if (MinifyCorpus.drops(element, relative, documents, referenced)) {
							droppedRecords++
							return
						}

						records << MinifyCorpus.trimRecord(element)
						keptRecords++
					}

					if (!records.isEmpty()) {
						trimmed[key] = records
					}
				} else if (value instanceof Map && value.containsKey('id')) {
					// A lone `name` object: an item's own name, which the loader reads as a record.
					if (MinifyCorpus.drops(value, relative, documents, referenced)) {
						droppedRecords++
					} else {
						trimmed[key] = MinifyCorpus.trimRecord(value)
						keptRecords++
					}
				}
			}

			def target = new File(out, relative)
			target.parentFile.mkdirs()

			def text = new StringBuilder()
			MinifyCorpus.write(trimmed, text)
			target.setText(text.toString(), 'UTF-8')

			before += new File(root, relative).length()
			after += target.length()
		}

		logger.lifecycle(
			'语料已精简: {} 个文件, 保留记录 {} 条, 丢弃 {} 条（translate:false 或整条无译文，引擎本来也会丢）, {} KiB -> {} KiB ({}%)',
			documents.size(), keptRecords, droppedRecords, before.intdiv(1024), after.intdiv(1024),
			before == 0 ? 0 : Math.round(100.0d * after / before) as int
		)
	}

	/**
	 * Compact JSON, with every character that does not have to be escaped written as itself.
	 *
	 * Groovy's own JsonOutput escapes anything outside ASCII, which turns each Chinese character from
	 * three UTF-8 bytes into a six-byte {@code \\uXXXX} and would hand back most of what the trimming
	 * saves — on a corpus that is nearly all Chinese, that is the difference between a third of the
	 * original size and two thirds of it. Only what RFC 8259 requires is escaped: the quote, the
	 * backslash, and the C0 controls.
	 */
	static void write(Object value, StringBuilder out) {
		if (value == null) {
			out.append('null')
		} else if (value instanceof Map) {
			out.append('{')
			boolean first = true

			value.each { key, member ->
				if (!first) {
					out.append(',')
				}

				first = false
				writeString(key as String, out)
				out.append(':')
				write(member, out)
			}

			out.append('}')
		} else if (value instanceof List) {
			out.append('[')

			value.eachWithIndex { member, index ->
				if (index > 0) {
					out.append(',')
				}

				write(member, out)
			}

			out.append(']')
		} else if (value instanceof Boolean || value instanceof Number) {
			out.append(value.toString())
		} else {
			writeString(value as String, out)
		}
	}

	private static void writeString(String value, StringBuilder out) {
		out.append('"')

		for (int i = 0; i < value.length(); i++) {
			char c = value.charAt(i)

			switch (c) {
				case '"' -> out.append('\\"')
				case '\\' -> out.append('\\\\')
				case '\n' -> out.append('\\n')
				case '\r' -> out.append('\\r')
				case '\t' -> out.append('\\t')
				case '\b' -> out.append('\\b')
				case '\f' -> out.append('\\f')
				default -> {
					if (c < 0x20) {
						out.append(String.format('\\u%04x', (int) c))
					} else {
						// Everything else, including §, CJK and the private-use glyphs of Hypixel's
						// icon font, goes out as itself in UTF-8.
						out.append(c)
					}
				}
			}
		}

		out.append('"')
	}

	/** Walks every record of a document the way TranslationLoader#records does. */
	static void eachRecord(Object document, Closure action) {
		document.each { key, value ->
			if (value instanceof List) {
				value.each { element ->
					if (element instanceof Map && element.containsKey('id')) {
						action(element)
					}
				}
			} else if (value instanceof Map && value.containsKey('id')) {
				action(value)
			}
		}
	}

	/**
	 * Whether the loader would throw this record away, in which case shipping it only costs bytes.
	 *
	 * Mirrors TranslationEntry#compile's two refusals — nothing translated and not a continuation, or
	 * `translate: false` — applied to the record a `ref` resolves to, since that is the data the
	 * loader compiles.
	 */
	static boolean drops(Map record, String relative, Map documents, Set referenced) {
		if (referenced.contains(relative + '#' + record.id)) {
			return false
		}

		def source = MinifyCorpus.resolve(record, documents)

		if (source.translate == false) {
			return true
		}

		if (source.continuation == true) {
			return false
		}

		if (source.segments instanceof List && !source.segments.isEmpty()) {
			return source.segments.every { segment -> !(segment.zh) }
		}

		return !(source.zh)
	}

	/** Follows a `ref` to the shared library; a record without one is already itself. */
	static Map resolve(Map record, Map documents) {
		if (!(record.ref instanceof String)) {
			return record
		}

		def parts = (record.ref as String).split('#', 2)

		if (parts.length != 2) {
			return record
		}

		def document = documents[parts[0]]

		if (document == null) {
			return record
		}

		Map found = null

		MinifyCorpus.eachRecord(document) { candidate ->
			if (found == null && candidate.id == parts[1]) {
				found = candidate
			}
		}

		return found ?: record
	}

	static Map trimRecord(Map record) {
		def trimmed = [:]

		record.each { key, value ->
			if (!RECORD_KEYS.contains(key)) {
				return
			}

			if (key == 'segments' && value instanceof List) {
				trimmed[key] = value.collect { segment -> segment.subMap(SEGMENT_KEYS.intersect(segment.keySet())) }
			} else if (key == 'placeholders' && value instanceof List) {
				def placeholders = value.collect { placeholder ->
					placeholder.subMap(PLACEHOLDER_KEYS.intersect(placeholder.keySet()))
				}

				// An empty `placeholders: []` says "this line has no values in it", which is the
				// absence of the key as far as the loader is concerned.
				if (!placeholders.isEmpty()) {
					trimmed[key] = placeholders
				}
			} else {
				trimmed[key] = value
			}
		}

		return trimmed
	}

	static List trimTerms(Object terms) {
		if (!(terms instanceof List)) {
			return []
		}

		return terms.collect { term -> term.subMap(TERM_KEYS.intersect(term.keySet())) }
	}
}

// What the trimming actually buys, for when somebody wonders whether it is worth the task.
tasks.register('corpusSize') {
	group = 'help'
	description = 'Reports the authored and shipped size of the translation corpus.'

	dependsOn 'minifyCorpus'

	doLast {
		def measure = { File dir ->
			long bytes = 0
			int files = 0
			dir.eachFileRecurse { file ->
				if (file.isFile() && file.name.endsWith('.json')) {
					bytes += file.length()
					files++
				}
			}
			[bytes, files]
		}

		def (authoredBytes, authoredFiles) = measure(rootProject.file('original_text'))
		def (shippedBytes, shippedFiles) = measure(minifiedCorpus.get().asFile)

		logger.lifecycle('语料 (original_text/): {} 个文件, {} KiB', authoredFiles, authoredBytes.intdiv(1024))
		logger.lifecycle('打包进 jar 的精简版:   {} 个文件, {} KiB', shippedFiles, shippedBytes.intdiv(1024))
		logger.lifecycle('省下 {} KiB（{}%）', (authoredBytes - shippedBytes).intdiv(1024),
			100 - (Math.round(100.0d * shippedBytes / authoredBytes) as int))
	}
}

// A name that is both a menu row and a value inside a sentence lives in two places — a record and a
// term — and nothing else in the build notices when the two drift apart. Python rather than Java
// because it reads the corpus as data and has no business being on the mod's classpath.
tasks.register('checkTermRecords', Exec) {
	group = 'verification'
	description = 'Checks that a term and the record it cross-references give the same translation.'

	commandLine 'python', rootProject.file('gradle/check_toggle_terms.py').absolutePath
	workingDir rootProject.projectDir
}

// `check` here is the corpus-level check. Running it from the root also runs each target's own
// `check` — Gradle matches the task name across every project — which is what puts the translation,
// capture and command harnesses on both Minecraft versions rather than only the newest.
tasks.named('check') {
	dependsOn 'checkTermRecords'
}

// Every jar the build can produce, in one directory, named for the Minecraft it is for. Two files:
// installing the wrong one is the one mistake a multi-version mod invites, and `+mc26.1` in the file
// name is the cheapest possible guard against it.
//
// The jars arrive through a configuration rather than by reaching into each target for its `jar` task:
// a task in another project has not been registered yet while this one is being configured, and
// resolving a dependency at execution time is both correct and one less ordering rule to remember.
configurations {
	targetJars {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	subprojects.each { target ->
		targetJars project(path: target.path, configuration: 'distJar')
	}
}

tasks.register('dist', Sync) {
	group = 'build'
	description = 'Collects each target jar into build/dist, after checking both.'

	// Sync removes files left by an older version. A plain Copy would leave two apparently valid jars
	// in the advertised distribution directory after a version bump, inviting somebody to install the
	// stale one. This directory is owned by this task, so keep it exactly equal to the current pair.

	// Resolving the configuration builds each jar but not each target's `check`, and a jar somebody is
	// about to install is the last one that should skip its Mixin target resolution. Named by path so
	// no task in another project is looked up while this one is being configured.
	dependsOn tasks.named('check')
	subprojects.each { target -> dependsOn "${target.path}:check" }

	from configurations.targetJars
	into layout.buildDirectory.dir('dist')

	doLast {
		destinationDir.eachFile { file ->
			logger.lifecycle('可分发 jar: {} ({} KiB)', file.name, file.length().intdiv(1024))
		}
	}
}
